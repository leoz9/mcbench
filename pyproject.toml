[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcbench"
version = "0.1.0"
description = "McBench：大模型点麦当劳擂台 —— LLM agent benchmark on McDonald's China MCP (dry-run, never orders)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]

[project.scripts]
mcbench = "mcbench.cli:main"

[tool.setuptools]
packages = ["mcbench"]

[tool.setuptools.package-data]
mcbench = ["fixtures/*.json"]
