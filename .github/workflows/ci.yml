name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q
  community-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - name: Validate community tasks (schema + solver on frozen snapshot)
        run: mcbench tasks validate tasks/community/
      - name: Offline scripted baselines (dev split)
        run: mcbench run --demo-agents --split dev --max-steps 150 --out runs/ci
