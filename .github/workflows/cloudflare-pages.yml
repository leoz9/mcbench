name: Deploy site to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Deploy web/ to Pages project "mcbench"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy web --project-name mcbench --branch main --commit-hash "$GITHUB_SHA"
