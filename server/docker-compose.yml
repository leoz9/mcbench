# Run from repo root:  docker compose -f server/docker-compose.yml --env-file server/.env up -d --build
# No host ports are published: traffic only arrives through the Cloudflare Tunnel.
services:
  api:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes:
      - mcbench-data:/data
      - ../web/data:/app/web/data:ro,z   # official board; `git pull` updates it without rebuild
    networks: [internal]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Remotely-managed tunnel: ingress is configured in Cloudflare; only the token lives on the VPS (server/.env).
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in server/.env}
    depends_on: [api]
    networks: [internal]
volumes:
  mcbench-data:
networks:
  internal:
